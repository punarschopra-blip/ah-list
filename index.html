<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AH List">
<meta name="theme-color" content="#00A0E2"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>AH List</title>
<style>
:root{--ah:#00A0E2;--ahd:#0079B8;--bg:#f2f5f8;--card:#fff;--tx:#14202b;--mu:#6b7a88;--ln:#e3e9ef;--ok:#2bb673}
@media(prefers-color-scheme:dark){:root{--bg:#0d1419;--card:#18222b;--tx:#eef3f7;--mu:#8fa0ae;--ln:#24313c;--ahd:#5cc6f2}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:17px/1.35 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(30px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--ah);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 12px}
.top{display:flex;align-items:center;gap:10px}h1{font-size:24px;margin:0;flex:1}
.pill{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:20px;padding:7px 12px;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:#ffd34d;display:inline-block}.dot.on{background:#7CFFB2}
form{display:flex;gap:8px;margin-top:10px;position:relative}
#q{flex:1;font-size:18px;border:0;border-radius:14px;padding:14px;background:#fff;color:#14202b;outline:none}
#add{width:54px;border:0;border-radius:14px;background:#fff;color:var(--ah);font-size:30px;font-weight:700}
#sug{position:absolute;left:0;right:62px;top:56px;background:var(--card);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden;display:none}
#sug div{padding:13px 14px;border-bottom:1px solid var(--ln);color:var(--tx);display:flex;justify-content:space-between}#sug small{color:var(--mu)}
main{padding:10px 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:20px;padding:9px 14px;font-size:15px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:16px 6px 6px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);padding:12px 14px;min-height:58px;border-bottom:1px solid var(--ln)}
.grp .item:first-of-type{border-radius:14px 14px 0 0}.grp .item:last-child{border-radius:0 0 14px 14px;border:0}.grp .item:only-of-type{border-radius:14px}
.ck{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ah);flex:none;display:grid;place-items:center;color:#fff;font-size:17px}
.done .ck{background:var(--ok);border-color:var(--ok)}.done .nm{text-decoration:line-through;color:var(--mu)}
.bd{flex:1;min-width:0}.nm{font-size:18px}.meta{font-size:13px;color:var(--mu)}
.q{font-weight:700;color:var(--ahd);margin-right:4px}.who{font-size:12px;border-radius:10px;padding:2px 8px;color:#fff;flex:none}
.P{background:#0079B8}.A{background:#e0569b}
.empty{text-align:center;color:var(--mu);padding:50px 20px}.empty b{font-size:46px;display:block}
.bar{display:flex;gap:8px;margin:18px 2px}.btn{flex:1;border:0;border-radius:14px;padding:14px;font-size:16px;background:var(--card);color:var(--tx)}
.btn.p{background:var(--ah);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(150px);background:#222;color:#fff;border-radius:14px;padding:12px 16px;display:flex;gap:16px;align-items:center;transition:.25s;z-index:20}
#toast.s{transform:translateX(-50%)}#toast button{background:none;border:0;color:#5cc6f2;font-weight:700;font-size:16px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:30}.sheet.s{display:flex}
.pan{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
.pan h3{margin:0 0 14px}.pan input,.pan select{width:100%;font-size:17px;padding:13px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);margin-bottom:10px}
.row{display:flex;gap:8px}.big{font-size:22px;padding:22px}
.pic{font-size:28px;width:34px;text-align:center;flex:none}.meta a{color:var(--ahd)}.tot{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:6px;font-size:15px}.foot{display:block;color:var(--mu);font-size:13px;margin:8px 6px}.foot select{font-size:15px;margin-left:6px;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px}</style></head><body>
<header><div class="top"><h1>Groceries</h1><span class="dot" id="dot"></span><button class="pill" id="me"></button></div>
<form id="f" autocomplete="off"><input id="q" placeholder="What do we need? (e.g. 2 milk)" enterkeyhint="done"><button id="add">+</button><div id="sug"></div></form></header>
<main><div id="tot" class="tot"></div><div class="chips" id="chips"></div><div id="list"></div>
<div class="bar"><button class="btn" id="clr">Clear ticked</button></div><label class="foot">Store <select id="store"></select></label><p class="foot">Product names, sizes &amp; prices come from a daily snapshot of ah.nl (via the open checkjebon dataset); "~" prices are estimates. Aisle order is a typical AH layout, not this store's real map. Tap "ah.nl" for the photo.</p></main>
<div id="toast"><span id="tm"></span><button id="undo">Undo</button></div>
<div class="sheet" id="who"><div class="pan"><h3>Who are you?</h3><div class="row"><button class="btn p big" data-w="Punardeep">Punardeep</button><button class="btn p big" style="background:#e0569b" data-w="Aastha">Aastha</button></div></div></div>
<div class="sheet" id="ed"><div class="pan"><h3>Edit</h3><input id="en" placeholder="Name"><div class="row"><input id="eq" placeholder="Qty" style="flex:1"><select id="ec" style="flex:2"></select></div><input id="eo" placeholder="Note (brand, organic, …)">
<div class="row"><button class="btn" id="edel" style="color:#e5484d">Delete</button><button class="btn p" id="esave">Save</button></div></div></div>
<script src="config.js"></script><script src="app.js"></script></body></html>
